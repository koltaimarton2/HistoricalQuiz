name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch: 
    
jobs:

  build:

    runs-on: ubuntu-latest

    permissions: 
      packages: write
      contents: read
    steps:
    - uses: actions/checkout@v4
    - name: Docker Login
      uses: docker/login-action@v4.8.0
      with:
        registry: ghcr.io
        username: koltaimarton2
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build the Docker images
      run: | 
        VERSION=$(date +%s)
        docker build ./backend -t ghcr.io/koltaimarton2/quiz-backend:$VERSION
        docker build ./frontend -t ghcr.io/koltaimarton2/quiz-frontend:$VERSION
        docker push ghcr.io/koltaimarton2/quiz-backend:$VERSION
        docker push ghcr.io/koltaimarton2/quiz-frontend:$VERSION

        

        
